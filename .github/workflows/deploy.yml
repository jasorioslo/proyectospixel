name: Deploy a Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzar manualmente desde GitHub

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Si el secreto no existe, el job se salta limpio (no falla ni manda correos)
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        if: env.CF_API_TOKEN != ''
        uses: actions/checkout@v4

      - name: Verificar enlaces internos
        if: env.CF_API_TOKEN != ''
        run: node tools/check-links.mjs

      - name: Deploy a Cloudflare Pages
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=proyectospixel --branch=main --commit-dirty=true

      - name: Resumen
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "⏭️ Deploy automático omitido: faltan los secretos CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID."
            echo "   Añádelos en Settings → Secrets and variables → Actions para activar los deploys por push."
          else
            echo "✅ Desplegado a https://proyectospixel.pages.dev y https://proyectospixel.com"
          fi
